# Uma réplica por serviço reduz o consumo do laboratório.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

env: {}

# Referencie chaves criadas por ExternalSecret sem colocar valores confidenciais no Git.
secretEnv: []

probes:
  path: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s

serviceAccount:
  roleArn: ""

ingress:
  enabled: false
  path: /
