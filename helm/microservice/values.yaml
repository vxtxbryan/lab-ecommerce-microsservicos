# 1 replica porque os servicos guardam dados em memoria: com 2 pods, cada um
# teria sua propria "base" e as buscas dariam 404 de forma intermitente.
# Quando entrarem os bancos de dados (RDS/DynamoDB), podemos escalar.
replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: Always

containerPort: 8000

service:
  type: ClusterIP
  port: 80

env: {}

probes:
  path: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
