# Uma réplica por serviço reduz o consumo do laboratório.
replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: Always

containerPort: 8000

service:
  type: ClusterIP
  port: 80

env: {}

probes:
  path: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceAccount:
  roleArn: ""

ingress:
  enabled: false
  path: /
