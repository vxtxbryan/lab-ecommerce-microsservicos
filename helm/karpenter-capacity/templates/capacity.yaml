apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: workloads
spec:
  instanceProfile: {{ required "instanceProfile obrigatório" .Values.instanceProfile | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "cluster obrigatório" .Values.cluster | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.cluster | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  tags:
    Project: {{ .Values.cluster | quote }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workloads
spec:
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
  template:
    metadata:
      labels:
        workload: application
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: workloads
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [t3.medium, t3.large]
