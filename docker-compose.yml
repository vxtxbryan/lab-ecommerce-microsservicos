services:
  products:
    build: ./services/products
    ports:
      - "8000:8000"
    volumes:
      - ./services/products:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - lab-network

  users:
    build: ./services/users
    ports:
      - "8002:8002"
    volumes:
      - ./services/users:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    networks:
      - lab-network

  payments:
    build: ./services/payments
    ports:
      - "8003:8003"
    volumes:
      - ./services/payments:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    networks:
      - lab-network

  orders:
    build: ./services/orders
    ports:
      - "8001:8001"
    environment:
      - PRODUCTS_SERVICE_URL=http://products:8000
      - USERS_SERVICE_URL=http://users:8002
      - PAYMENTS_SERVICE_URL=http://payments:8003
    volumes:
      - ./services/orders:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - products
      - users
      - payments
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
