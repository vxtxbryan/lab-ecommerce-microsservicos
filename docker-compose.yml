services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal
    networks: [lab-network]

  init-tables:
    build:
      context: .
      dockerfile: services/products/Dockerfile
    command: python init_local.py
    restart: on-failure
    depends_on: [dynamodb]
    environment: &local-db
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    networks: [lab-network]

  products:
    environment:
      <<: *local-db
      PRODUCTS_TABLE: products
    depends_on:
      init-tables:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/products/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/products:/app
      - ./common:/app/common:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - lab-network

  users:
    environment:
      <<: *local-db
      USERS_TABLE: users
    depends_on:
      init-tables:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/users/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/users:/app
      - ./common:/app/common:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    networks:
      - lab-network

  payments:
    environment:
      <<: *local-db
      PAYMENTS_TABLE: payments
    depends_on:
      init-tables:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./services/payments:/app
      - ./common:/app/common:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    networks:
      - lab-network

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    ports:
      - "8001:8001"
    environment:
      <<: *local-db
      ORDERS_TABLE: orders
      PRODUCTS_SERVICE_URL: http://products:8000
      USERS_SERVICE_URL: http://users:8002
      PAYMENTS_SERVICE_URL: http://payments:8003
    volumes:
      - ./services/orders:/app
      - ./common:/app/common:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - products
      - users
      - payments
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

volumes:
  dynamodb-data:
