name: CI

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "tests/**"
      - "infra/**"
      - "helm/**"
      - "scripts/**"
      - ".trivyignore.yaml"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "tests/**"
      - "infra/**"
      - "helm/**"
      - "scripts/**"
      - ".trivyignore.yaml"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: ecommerce-microsservicos

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.1
      - name: Validar Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate
      - name: Validar charts e scripts
        run: |
          bash scripts/validate-charts.sh /tmp/rendered
          for script in scripts/*.sh; do bash -n "$script"; done
          docker compose config --quiet
      - name: Trivy configuração
        run: |
          docker run --rm -v "$PWD:/src:ro" -v /tmp/rendered:/rendered:ro -w /src aquasec/trivy:0.76.2 config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml --skip-dirs .git --skip-dirs helm --skip-dirs infra/terraform/.terraform .
          docker run --rm -v /tmp/rendered:/rendered:ro aquasec/trivy:0.76.2 config --severity HIGH,CRITICAL --exit-code 1 /rendered

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências dos testes
        run: pip install -r services/orders/requirements.txt pytest
      - name: Subir serviços e aguardar APIs
        run: |
          docker compose up --build -d
          python - <<'PYTHON'
          import time
          import httpx
          for port in (8000, 8001, 8002, 8003):
              deadline = time.monotonic() + 120
              while True:
                  try:
                      response = httpx.get(f"http://localhost:{port}/health", timeout=3)
                      if response.status_code == 200:
                          break
                  except httpx.RequestError:
                      pass
                  if time.monotonic() >= deadline:
                      raise SystemExit(f"API na porta {port} indisponível")
                  time.sleep(2)
          PYTHON
      - name: Executar testes unitários e integração
        env:
          USERS_TEST_URL: http://localhost:8002
          STOCK_TEST_URL: http://localhost:8000
          PAYMENT_TEST_URL: http://localhost:8003
        run: |
          python -m pytest -q --junitxml=/tmp/results.xml tests
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          suites = ET.parse("/tmp/results.xml").getroot().iter("testsuite")
          assert all(int(s.attrib.get("skipped", 0)) == 0 for s in suites), "Testes ignorados"
          PYTHON
      - name: Diagnóstico
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Limpeza
        if: always()
        run: docker compose down --volumes

  build-scan-push:
    needs: [tests, configuration]
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necessario para o OIDC com a AWS
    strategy:
      fail-fast: false
      matrix:
        service: [products, orders, users, payments]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: |
          docker build \
            -t local/${{ matrix.service }}:${{ github.sha }} \
            services/${{ matrix.service }}

      # Pinada pelo hash do commit (v0.36.0): em 2026 tags desta action
      # foram comprometidos em um ataque a cadeia de suprimentos.
      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Daqui para baixo so roda em push na main (nao em pull requests)
      - name: Autenticar na AWS (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag e push para o ECR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPO="${REGISTRY}/${PROJECT_NAME}-${{ matrix.service }}"
          docker tag local/${{ matrix.service }}:${{ github.sha }} "${REPO}:${{ github.sha }}"
          docker tag local/${{ matrix.service }}:${{ github.sha }} "${REPO}:latest"
          docker push "${REPO}:${{ github.sha }}"
          docker push "${REPO}:latest"
