apiVersion: v1
kind: Pod
metadata:
  name: karpenter-scale-test
spec:
  nodeSelector:
    karpenter.sh/nodepool: workloads
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 0
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 250m
          memory: 64Mi
