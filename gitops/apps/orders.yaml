apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ecommerce
  sources:
    - repoURL: https://github.com/vxtxbryan/lab-ecommerce-microsservicos.git
      targetRevision: main
      path: helm/microservice
      helm:
        releaseName: orders
        valueFiles:
          - $values/helm/values/orders.yaml
    - repoURL: https://github.com/vxtxbryan/lab-ecommerce-microsservicos.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
